<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — StyleShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo logo">StyleShop</a>
      <nav class="header__nav nav">
        <ul class="nav__list" style="display:flex; position:static;">
          <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
          <li class="nav__item"><a href="catalog.html" class="nav__link">Каталог</a></li>
          <li class="nav__item"><a href="cart.html" class="nav__link">Корзина</a></li>
          <li class="nav__item"><a href="contacts.html" class="nav__link">Контакты</a></li>
          <li class="nav__item"><a href="register.html" class="nav__link">Регистрация</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="forms" style="padding: 4rem 0;">
      <div class="container" style="max-width: 500px;">
        <form class="form form_login" novalidate>
          <h2 class="form__title">Вход</h2>

          <div class="form__field">
            <label for="login-email" class="form__label">Email <span class="form__required">*</span></label>
            <input type="email" id="login-email" name="email" class="form__input" required>
          </div>
          <div class="form__field">
            <label for="login-password" class="form__label">Пароль <span class="form__required">*</span></label>
            <input type="password" id="login-password" name="password" class="form__input" required>
          </div>
          <button type="submit" class="button button_theme_primary button_size_l form__submit">Войти</button>

          <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-muted);">
            Нет аккаунта? <a href="register.html" style="color: var(--color-primary); text-decoration: underline;">Зарегистрироваться</a>
          </p>
        </form>
      </div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
