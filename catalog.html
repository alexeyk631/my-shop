<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — StyleShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo logo">StyleShop</a>

      <button class="header__burger burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="main-nav">
        <span class="burger__line"></span>
        <span class="burger__line"></span>
        <span class="burger__line"></span>
      </button>

      <nav class="header__nav nav" id="main-nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
          <li class="nav__item"><a href="catalog.html" class="nav__link nav__link--active">Каталог</a></li>
          <li class="nav__item"><a href="cart.html" class="nav__link">Корзина</a></li>
          <li class="nav__item"><a href="contacts.html" class="nav__link">Контакты</a></li>
          <li class="nav__item"><a href="register.html" class="nav__link">Регистрация</a></li>
          <li class="nav__item"><a href="profile.html" class="nav__link">Кабинет</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="catalog">
      <div class="container">
        <h1 class="section-title">Каталог товаров</h1>
        
        <!-- Строка поиска -->
        <div class="search">
          <input
            type="search"
            id="search-input"
            class="search__input"
            placeholder="Поиск товаров..."
            aria-label="Поиск товаров"
          />
          <div id="search-results" class="search__results"></div>
        </div>

        <!-- Сюда скрипт будет вставлять товары из базы данных -->
        <div id="catalog-grid" class="category__grid"></div>
        
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© 2026 StyleShop. Все права защищены.</p>
      <a href="privacy.txt" target="_blank" download class="footer__link">Политика конфиденциальности</a>
      <ul class="footer__socials">
        <li><a href="#" class="footer__link">VK</a></li>
        <li><a href="#" class="footer__link">Telegram</a></li>
        <li><a href="#" class="footer__link">Instagram</a></li>
      </ul>
    </div>
  </footer>

  <!-- Подключаем основной скрипт (там поиск и меню) -->
  <script src="js/script.js"></script>
  <!-- Подключаем скрипт для загрузки каталога -->
  <script src="js/catalog-page.js"></script>
  
</body>
</html>
